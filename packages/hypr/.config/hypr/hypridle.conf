$lock_cmd = pidof hyprlock || hyprlock
$suspend_cmd = systemctl suspend || loginctl suspend

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = $lock_cmd
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 1200 # 20 min
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1800 # 30 min
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# ─────────────────────────────────────────────────────────────────────────────
# Idle Inhibition Rules (migrated from windows.conf idleinhibit rules)
# ─────────────────────────────────────────────────────────────────────────────

# Media players - prevent idle when video playing (fullscreen)
listener {
    timeout = 300 # 5 min
    on-timeout = loginctl lock-session
    on-resume = 
    ignore_video = true  # Don't idle when fullscreen video detected
}

# Music players - always prevent idle when focused
listener {
    timeout = 600 # 10 min
    on-timeout = loginctl lock-session
    on-resume = 
    ignore_docked = true  # Prevent idle for docked/media applications
}

# Gaming - prevent idle when steam games running
listener {
    timeout = 900 # 15 min
    on-timeout = loginctl lock-session
    on-resume = 
}

