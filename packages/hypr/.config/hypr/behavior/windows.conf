# ═══════════════════════════════════════════════════════════════════════════════
# Vibearchy Window Rules
# Float, size, position, opacity, and workspace assignments
# Hyprland 0.53+ syntax
# ═══════════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────
# Float Rules - Size Categories
# ─────────────────────────────────────────────────────────────────────────────

# Large centered floats (70% size)
# Matches: center-float-large, qimgv (image viewer), mpv (video player)
windowrule = float on, match:class ^(center-float-large|.*qimgv.*|.*mpv.*)$
windowrule = size 70% 70%, match:class ^(center-float-large|.*qimgv.*|.*mpv.*)$
windowrule = center on, match:class ^(center-float-large|.*qimgv.*|.*mpv.*)$

# Standard centered floats (50% size)
windowrule = float on, match:class ^(center-float)$
windowrule = size 50% 50%, match:class ^(center-float)$
windowrule = center on, match:class ^(center-float)$

# File dialogs
windowrule = float on, match:title ^(.*(Open Folder|Open File|Save File|Save Folder|Save Image|Save As|Open As).*)$
windowrule = size 50% 50%, match:title ^(.*(Open Folder|Open File|Save File|Save Folder|Save Image|Save As|Open As).*)$
windowrule = center on, match:title ^(.*(Open Folder|Open File|Save File|Save Folder|Save Image|Save As|Open As).*)$

# Mini centered floats (30% width, 40% height)
windowrule = float on, match:class ^(center-float-mini|.*galculator.*|.*ytdlp-gui.*|.*udiskie.*|.*Calculator.*)$
windowrule = size 30% 40%, match:class ^(center-float-mini|.*galculator.*|.*ytdlp-gui.*|.*udiskie.*|.*Calculator.*)$
windowrule = center on, match:class ^(center-float-mini|.*galculator.*|.*ytdlp-gui.*|.*udiskie.*|.*Calculator.*)$

# System utilities
windowrule = float on, match:class ^(xfce-polkit|wleave|nwg-look|nm-connection-editor|org.twosheds.iwgtk|overskride)$
windowrule = float on, match:title ^(branchdialog)$

# ─────────────────────────────────────────────────────────────────────────────
# Smart Gaps (Single Window)
# ─────────────────────────────────────────────────────────────────────────────
# Remove gaps when only one window on workspace.
# NOTE: border:false removed — in Hyprland 0.54+ the w[tg1] selector correctly
# matches window groups (multiple tabs = 1 tiled slot), so border:false was
# silently suppressing the active-window highlight inside groups.
workspace = w[t1], gapsout:0, gapsin:0
workspace = w[tg1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0

# ─────────────────────────────────────────────────────────────────────────────
# Browser Rules
# ─────────────────────────────────────────────────────────────────────────────

# Zen Browser
windowrule = tile on, match:class ^(zen)$, match:title ^(?!.*[Pp]op-?up)(?!.*[Dd]ialog)(?!.*[Pp]icture-in-[Pp]icture).*$
windowrule = float on, match:class ^(zen)$, match:title .*([Pp]op-?up|[Dd]ialog|[Pp]icture-in-[Pp]icture).*
windowrule = float on, match:class ^(zen)$, match:title ^(Opening).*
windowrule = float on, match:class ^(zen)$, match:title ^(File Upload).*
windowrule = float on, match:class ^(zen)$, match:title ^(Save As).*
windowrule = float on, match:class ^(zen)$, match:title ^(Open File).*
windowrule = center on, match:class ^(zen)$
windowrule = size 800 600, match:class ^(zen)$, match:title .*([Pp]op-?up|[Dd]ialog).*
windowrule = float on, match:class ^(zen)$, match:title ^(Picture-in-Picture)$
windowrule = pin on, match:class ^(zen)$, match:title ^(Picture-in-Picture)$
windowrule = size 640 360, match:class ^(zen)$, match:title ^(Picture-in-Picture)$
windowrule = float on, match:class ^(zen)$, match:title .*Firefox.*
windowrule = center on, match:class ^(zen)$, match:title .*Firefox.*
windowrule = float on, match:class ^(zen)$, match:title ^(Firefox — Sharing Indicator)$
windowrule = move 0 0, match:class ^(zen)$, match:title ^(Firefox — Sharing Indicator)$
windowrule = no_blur on, match:class ^(zen)$, match:title ^(Firefox — Sharing Indicator)$

# Firefox/LibreWolf
windowrule = float on, match:class ^(.*LibreWolf.*)$, match:title ^(Library)$
windowrule = float on, match:class ^(.*zen-alpha.*)$, match:title ^(Library)$
windowrule = float on, match:class ^(firefox)$, match:title ^(Library)$
windowrule = float on, match:title ^(Picture-in-Picture)$
windowrule = pin on, match:title ^(Picture-in-Picture)$
windowrule = size 25% 25%, match:title ^(Picture-in-Picture)$
windowrule = move 74% 74%, match:title ^(Picture-in-Picture)$
windowrule = float on, match:title ^(Firefox — Sharing Indicator)$
windowrule = move 0 0, match:title ^(Firefox — Sharing Indicator)$

# Chromium
windowrule = opaque on, match:class ^(chromium|Chromium)$
windowrule = no_blur on, match:class ^(chromium|Chromium)$

# ─────────────────────────────────────────────────────────────────────────────
# Application-Specific Rules
# ─────────────────────────────────────────────────────────────────────────────

# Discord
windowrule = float on, match:class ^(discord)$, match:title ^(Discord Updater)$
windowrule = float on, match:class ^(Signal)$, match:title ^(Signal)$

# File Managers
windowrule = float on, match:class ^(thunar)$, match:title ^(File Operation Progress)$
windowrule = float on, match:class ^(thunar)$, match:title ^(Confirm to replace files)$
windowrule = float on, match:class ^(nemo)$, match:title ^(.*Properties)$
windowrule = size 40% 50%, match:class ^(thunar|nemo)$, match:title ^(.*Properties)$

# General dialogs
windowrule = float on, match:title ^(Open File)$
windowrule = float on, match:title ^(Save File)$
windowrule = float on, match:title ^(Save As)$
windowrule = float on, match:title ^(Open Folder)$
windowrule = center on, match:title ^(Open File|Save File|Save As|Open Folder)$

# XWayland Video Bridge (screen sharing compatibility)
windowrule = opacity 0.0 override 0.0 override, match:class ^(.*xwaylandvideobridge.*)$
windowrule = no_anim on, match:class ^(.*xwaylandvideobridge.*)$
windowrule = no_blur on, match:class ^(.*xwaylandvideobridge.*)$
windowrule = size 1 1, match:class ^(.*xwaylandvideobridge.*)$

# Zathura (PDF viewer - 35% width, 90% height)
windowrule = float on, match:class ^(.*zathura.*)$
windowrule = size 35% 90%, match:class ^(.*zathura.*)$
windowrule = center on, match:class ^(.*zathura.*)$

# Scrcpy (Android screen mirroring)
windowrule = float on, match:class ^(.*scrcpy.*)$
windowrule = center on, match:class ^(.*scrcpy.*)$

# btop (launched via kitty with custom class)
windowrule = float on, match:class ^(btop-float)$
windowrule = size 50% 60%, match:class ^(btop-float)$
windowrule = center on, match:class ^(btop-float)$

# Puppeteer/Automation
windowrule = float on, match:class ^(chromium|google-chrome|Chromium)$, match:title ^(about:blank|Puppeteer)
windowrule = size 1920 1080, match:class ^(chromium|google-chrome|Chromium)$, match:title ^(about:blank|Puppeteer)
windowrule = center on, match:class ^(chromium|google-chrome|Chromium)$, match:title ^(about:blank|Puppeteer)

# ─────────────────────────────────────────────────────────────────────────────
# Transparency Rules
# ─────────────────────────────────────────────────────────────────────────────

# Development - Full opacity
windowrule = opacity 1.0 override 1.0 override, match:class ^(Code|VSCodium|neovide|neovim)$
windowrule = opacity 1.0 override 1.0 override, match:class ^(jetbrains-.*)$

# Terminals - Slight transparency
windowrule = opacity 0.90 override 0.85 override, match:class ^(ghostty)$
windowrule = opacity 0.95 override 0.90 override, match:class ^(kitty|Alacritty)$

# Media - Full opacity
windowrule = opacity 1.0 override 1.0 override, match:class ^(mpv|vlc|youtube)$
windowrule = opacity 1.0 override 1.0 override, match:title ^(.*YouTube.*)$

# ─────────────────────────────────────────────────────────────────────────────
# Animation Rules
# ─────────────────────────────────────────────────────────────────────────────

windowrule = animation slide, match:title ^(.*cava.*)$
windowrule = animation popin, match:class ^(.*wleave.*)$

# ─────────────────────────────────────────────────────────────────────────────
# Layer Rules
# ─────────────────────────────────────────────────────────────────────────────

layerrule = animation popin, match:namespace rofi
layerrule = blur on, match:namespace rofi
layerrule = ignore_alpha 1, match:namespace rofi

layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 1, match:namespace waybar

layerrule = ignore_alpha 1, match:namespace swaync-notification-window
layerrule = ignore_alpha 1, match:namespace swaync-control-center
layerrule = animation slide, match:namespace swaync-notification-window
layerrule = animation slide, match:namespace swaync-control-center

layerrule = animation fade, match:namespace swayosd
layerrule = animation fade, match:namespace selection
layerrule = animation fade, match:namespace hyprlock
layerrule = no_anim on, match:namespace hyprpicker
