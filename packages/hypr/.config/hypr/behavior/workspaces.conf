# ═══════════════════════════════════════════════════════════════════════════════
# Vibearchy Workspace Configuration
# Monitor assignments and application workspace rules
# Hyprland 0.53+ syntax
# ═══════════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────
# Monitor Workspace Assignments
# ─────────────────────────────────────────────────────────────────────────────

# Laptop Display (eDP-1): Workspaces 1-9
workspace = 1, monitor:eDP-1, default:true
workspace = 2, monitor:eDP-1
workspace = 3, monitor:eDP-1
workspace = 4, monitor:eDP-1
workspace = 5, monitor:eDP-1
workspace = 6, monitor:eDP-1
workspace = 7, monitor:eDP-1
workspace = 8, monitor:eDP-1
workspace = 9, monitor:eDP-1

# External Monitor 1 (DP-1): Workspaces 10-18
workspace = 10, monitor:DP-1, default:true
workspace = 11, monitor:DP-1
workspace = 12, monitor:DP-1
workspace = 13, monitor:DP-1
workspace = 14, monitor:DP-1
workspace = 15, monitor:DP-1
workspace = 16, monitor:DP-1
workspace = 17, monitor:DP-1
workspace = 18, monitor:DP-1

# External Monitor 2 (DP-3): Workspaces 20-28
workspace = 20, monitor:DP-3, default:true
workspace = 21, monitor:DP-3
workspace = 22, monitor:DP-3
workspace = 23, monitor:DP-3
workspace = 24, monitor:DP-3
workspace = 25, monitor:DP-3
workspace = 26, monitor:DP-3
workspace = 27, monitor:DP-3
workspace = 28, monitor:DP-3

# ─────────────────────────────────────────────────────────────────────────────
# Application Workspace Assignments
# ─────────────────────────────────────────────────────────────────────────────

# Workspace 2: Development
windowrule = workspace 2, match:class ^(.*Code.*|.*codium.*|.*VSCodium.*|.*neovide.*|.*cursor.*)$
windowrule = tile on, match:class ^(Code|VSCodium|cursor)$
windowrule = tile on, match:class ^(.*neovide.*)$

# Workspace 3: Music Production
windowrule = workspace 3, match:class ^(.*vital.*|.*fl64.*)$
windowrule = workspace 3, match:title ^(.*FL Studio.*)$

# Workspace 4: Media/Design
windowrule = workspace 4, match:class ^(.*kdenlive.*)$
windowrule = workspace 4, match:class ^(.*obsproject.*)$
windowrule = workspace 4, match:class ^(.*pinta.*|.*krita.*|.*blender.*|.*Upscayl.*)$

# Workspace 5: System Tools
windowrule = workspace 5, match:class ^(.*virt-manager.*|.*PikaBackup.*|.*VirtualBox Manager.*|.*Vmware.*)$
windowrule = workspace 5, match:class ^(.*GParted.*|.*clamtk.*|.*gnome.Logs.*)$

# Workspace 6: Gaming
windowrule = workspace 6, match:class ^(.*steam_app.*|.*gamescope.*|.*atlauncher.*|.*Minecraft.*)$

# Workspace 7: Communication
windowrule = workspace 7 silent, match:class ^(.*discord.*|.*vesktop.*|.*WebCord.*|.*legcord.*)$
windowrule = workspace 7, match:class ^(Signal)$

# Workspace 8: Notes
windowrule = workspace 8, match:class ^(obsidian)$
windowrule = tile on, match:class ^(obsidian)$

# Workspace 12: Audio/Music
windowrule = workspace 12 silent, match:class ^(.*[Ss]potify.*|.*tidal-hifi.*|.*You[Tt]ube Music.*|.*feishin.*)$
windowrule = workspace 12, match:class ^(.*easyeffects.*|.*qpwgraph.*|.*Helvum.*|.*nicotine_plus.*|.*Picard.*)$

# Workspace 15: Game Launchers
windowrule = workspace 15 silent, match:class ^([Ss]team|.*heroic.*)$
windowrule = workspace 15, match:class ^(.*Ryujinx.*|.*cemu.*|.*dolphin.*|.*RetroArch.*|.*xemu.*|.*duckstation.*|.*rpcs3.*)$

# ─────────────────────────────────────────────────────────────────────────────
# Scratchpad Rules (Pyprland)
# ─────────────────────────────────────────────────────────────────────────────

# Large Scratchpad (70% size)
windowrule = float on, match:class ^(scratchpad-large)$
windowrule = center on, match:class ^(scratchpad-large)$
windowrule = size 70% 70%, match:class ^(scratchpad-large)$
windowrule = animation slide, match:class ^(scratchpad-large)$
windowrule = workspace special:scratchpad-large silent, match:class ^(scratchpad-large)$

# Standard Scratchpad (50% size)
windowrule = float on, match:class ^(scratchpad)$
windowrule = center on, match:class ^(scratchpad)$
windowrule = size 50% 50%, match:class ^(scratchpad)$
windowrule = animation slide, match:class ^(scratchpad)$
windowrule = workspace special:scratchpad silent, match:class ^(scratchpad)$

# Mini Scratchpad (30% width, 40% height)
windowrule = float on, match:class ^(scratchpad-mini)$
windowrule = center on, match:class ^(scratchpad-mini)$
windowrule = size 30% 40%, match:class ^(scratchpad-mini)$
windowrule = animation slide, match:class ^(scratchpad-mini)$
windowrule = workspace special:scratchpad-mini silent, match:class ^(scratchpad-mini)$

# Side Scratchpad (Ghostty bluetooth/volume)
windowrule = float on, match:class ^(.*com.ghostty-bluetooth.*|.*com.ghostty-volume.*)$
windowrule = center on, match:class ^(.*com.ghostty-bluetooth.*|.*com.ghostty-volume.*)$
windowrule = size 30% 90%, match:class ^(.*com.ghostty-bluetooth.*|.*com.ghostty-volume.*)$
windowrule = workspace special:scratchpad silent, match:class ^(.*com.ghostty-bluetooth.*|.*com.ghostty-volume.*)$

# Ghostty scratchpads (pinned)
windowrule = float on, match:class ^(pavucontrol)$
windowrule = pin on, match:class ^(pavucontrol)$
windowrule = float on, match:class ^(com.ghostty-volume)$
windowrule = pin on, match:class ^(com.ghostty-volume)$
windowrule = float on, match:class ^(com.ghostty-bluetooth)$
windowrule = pin on, match:class ^(com.ghostty-bluetooth)$
windowrule = float on, match:class ^(com.ghostty-scratchpad)$
windowrule = pin on, match:class ^(com.ghostty-scratchpad)$
windowrule = float on, match:class ^(com.ghostty-monitor)$
windowrule = pin on, match:class ^(com.ghostty-monitor)$
windowrule = float on, match:class ^(com.ghostty-lazygit)$
windowrule = pin on, match:class ^(com.ghostty-lazygit)$
windowrule = float on, match:class ^(com.ghostty-lazydocker)$
windowrule = pin on, match:class ^(com.ghostty-lazydocker)$
windowrule = float on, match:class ^(com.ghostty-atac)$
windowrule = pin on, match:class ^(com.ghostty-atac)$
windowrule = float on, match:class ^(com.ghostty-notes)$
windowrule = pin on, match:class ^(com.ghostty-notes)$
