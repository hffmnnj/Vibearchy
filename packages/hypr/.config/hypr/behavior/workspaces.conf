# ═══════════════════════════════════════════════════════════════════════════════
# Vibearchy Workspace Configuration
# Monitor assignments and application workspace rules
# ═══════════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────
# Monitor Workspace Assignments
# ─────────────────────────────────────────────────────────────────────────────

# Laptop Display (eDP-1): Workspaces 1-9
workspace = 1, monitor:eDP-1, default:true
workspace = 2, monitor:eDP-1
workspace = 3, monitor:eDP-1
workspace = 4, monitor:eDP-1
workspace = 5, monitor:eDP-1
workspace = 6, monitor:eDP-1
workspace = 7, monitor:eDP-1
workspace = 8, monitor:eDP-1
workspace = 9, monitor:eDP-1

# External Monitor 1 (DP-1): Workspaces 10-18
workspace = 10, monitor:DP-1, default:true
workspace = 11, monitor:DP-1
workspace = 12, monitor:DP-1
workspace = 13, monitor:DP-1
workspace = 14, monitor:DP-1
workspace = 15, monitor:DP-1
workspace = 16, monitor:DP-1
workspace = 17, monitor:DP-1
workspace = 18, monitor:DP-1

# External Monitor 2 (DP-3): Workspaces 20-28
workspace = 20, monitor:DP-3, default:true
workspace = 21, monitor:DP-3
workspace = 22, monitor:DP-3
workspace = 23, monitor:DP-3
workspace = 24, monitor:DP-3
workspace = 25, monitor:DP-3
workspace = 26, monitor:DP-3
workspace = 27, monitor:DP-3
workspace = 28, monitor:DP-3

# ─────────────────────────────────────────────────────────────────────────────
# Application Workspace Assignments
# ─────────────────────────────────────────────────────────────────────────────

# Workspace 2: Development
windowrulev2 = workspace 2, class:^(.*Code.*|.*codium.*|.*VSCodium.*|.*neovide.*|.*cursor.*)$
windowrulev2 = tile, class:^(Code|VSCodium|cursor)$
windowrulev2 = tile, class:^(.*neovide.*)$

# Workspace 3: Music Production
windowrulev2 = workspace 3, class:^(.*vital.*|.*fl64.*)$
windowrulev2 = workspace 3, title:^(.*FL Studio.*)$

# Workspace 4: Media/Design
windowrulev2 = workspace 4, class:^(.*kdenlive.*)$
windowrulev2 = workspace 4, class:^(.*obsproject.*)$
windowrulev2 = workspace 4, class:^(.*pinta.*|.*krita.*|.*blender.*|.*Upscayl.*)$

# Workspace 5: System Tools
windowrulev2 = workspace 5, class:^(.*virt-manager.*|.*PikaBackup.*|.*VirtualBox Manager.*|.*Vmware.*)$
windowrulev2 = workspace 5, class:^(.*GParted.*|.*clamtk.*|.*gnome.Logs.*)$

# Workspace 6: Gaming
windowrulev2 = workspace 6, class:^(.*steam_app.*|.*gamescope.*|.*atlauncher.*|.*Minecraft.*)$

# Workspace 7: Communication
windowrulev2 = workspace 7 silent, class:^(.*discord.*|.*vesktop.*|.*WebCord.*|.*legcord.*)$
windowrulev2 = workspace 7, class:^(Signal)$

# Workspace 8: Notes
windowrulev2 = workspace 8, class:^(obsidian)$
windowrulev2 = tile, class:^(obsidian)$

# Workspace 12: Audio/Music
windowrulev2 = workspace 12 silent, class:^(.*[Ss]potify.*|.*tidal-hifi.*|.*You[Tt]ube Music.*|.*feishin.*)$
windowrulev2 = workspace 12, class:^(.*easyeffects.*|.*qpwgraph.*|.*Helvum.*|.*nicotine_plus.*|.*Picard.*)$

# Workspace 15: Game Launchers
windowrulev2 = workspace 15 silent, class:^([Ss]team|.*heroic.*)$
windowrulev2 = workspace 15, class:^(.*Ryujinx.*|.*cemu.*|.*dolphin.*|.*RetroArch.*|.*xemu.*|.*duckstation.*|.*rpcs3.*)$

# ─────────────────────────────────────────────────────────────────────────────
# Scratchpad Rules (Pyprland)
# ─────────────────────────────────────────────────────────────────────────────

# Large Scratchpad (70% size) - managed by Pyprland
windowrulev2 = float, class:^(scratchpad-large)$
windowrulev2 = center, class:^(scratchpad-large)$
windowrulev2 = size 70% 70%, class:^(scratchpad-large)$
windowrulev2 = animation slide, class:^(scratchpad-large)$
windowrulev2 = workspace special:scratchpad-large silent, class:^(scratchpad-large)$

# Standard Scratchpad (50% size) - managed by Pyprland
windowrulev2 = float, class:^(scratchpad)$
windowrulev2 = center, class:^(scratchpad)$
windowrulev2 = size 50% 50%, class:^(scratchpad)$
windowrulev2 = animation slide, class:^(scratchpad)$
windowrulev2 = workspace special:scratchpad silent, class:^(scratchpad)$

# Mini Scratchpad (30% width, 40% height) - managed by Pyprland
windowrulev2 = float, class:^(scratchpad-mini)$
windowrulev2 = center, class:^(scratchpad-mini)$
windowrulev2 = size 30% 40%, class:^(scratchpad-mini)$
windowrulev2 = animation slide, class:^(scratchpad-mini)$
windowrulev2 = workspace special:scratchpad-mini silent, class:^(scratchpad-mini)$

# Side Scratchpad (Ghostty bluetooth/volume) - managed by Pyprland
windowrulev2 = float, class:^(.*com.ghostty-bluetooth.*|.*com.ghostty-volume.*)$
windowrulev2 = center, class:^(.*com.ghostty-bluetooth.*|.*com.ghostty-volume.*)$
windowrulev2 = size 30% 90%, class:^(.*com.ghostty-bluetooth.*|.*com.ghostty-volume.*)$
windowrulev2 = workspace special:scratchpad silent, class:^(.*com.ghostty-bluetooth.*|.*com.ghostty-volume.*)$

# Ghostty scratchpads (pinned)
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = pin, class:^(pavucontrol)$
windowrulev2 = float, class:^(com.ghostty-volume)$
windowrulev2 = pin, class:^(com.ghostty-volume)$
windowrulev2 = float, class:^(com.ghostty-bluetooth)$
windowrulev2 = pin, class:^(com.ghostty-bluetooth)$
windowrulev2 = float, class:^(com.ghostty-scratchpad)$
windowrulev2 = pin, class:^(com.ghostty-scratchpad)$
windowrulev2 = float, class:^(com.ghostty-monitor)$
windowrulev2 = pin, class:^(com.ghostty-monitor)$
windowrulev2 = float, class:^(com.ghostty-lazygit)$
windowrulev2 = pin, class:^(com.ghostty-lazygit)$
windowrulev2 = float, class:^(com.ghostty-lazydocker)$
windowrulev2 = pin, class:^(com.ghostty-lazydocker)$
windowrulev2 = float, class:^(com.ghostty-atac)$
windowrulev2 = pin, class:^(com.ghostty-atac)$
windowrulev2 = float, class:^(com.ghostty-notes)$
windowrulev2 = pin, class:^(com.ghostty-notes)$
